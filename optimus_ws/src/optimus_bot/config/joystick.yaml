# External (USB / Bluetooth) gamepad teleoperation.
#
# joy_node -> /joy -> teleop_twist_joy -> /joy_teleop/cmd_vel
#          -> joystick_gate (dashboard toggle) -> /cmd_vel
#
# Button/axis indices are for the SDL game-controller layout used by the ROS 2
# joy package (tested with the "shanwan Android GamePad"):
#   axes:    0 left stick X (left = +), 1 left stick Y (up = +)
#   buttons: 6 LB, 7 RB (this dongle reports the legacy layout; LB=6 confirmed)
# Speeds stay well under drivetrain.yaml limits (0.5 m/s, 1.0 rad/s).

joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.1
    autorepeat_rate: 20.0     # also the gate's "device connected" heartbeat

teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 6          # LB: hold to drive (deadman)
    enable_turbo_button: 7    # RB: hold with LB for faster driving (unconfirmed)
    axis_linear:
      x: 1
    scale_linear:
      x: 0.2                  # m/s
    scale_linear_turbo:
      x: 0.4                  # m/s
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 0.6                # rad/s
    scale_angular_turbo:
      yaw: 1.0                # rad/s

joystick_gate:
  ros__parameters:
    input_topic: /joy_teleop/cmd_vel
    output_topic: /cmd_vel
    joy_topic: /joy
    device_timeout_s: 1.0
    enabled_on_start: false   # must be switched on from the dashboard
