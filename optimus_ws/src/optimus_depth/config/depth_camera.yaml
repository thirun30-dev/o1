# Depth camera configuration (optimus_depth).
#
#   ros2 launch optimus_bot bringup.launch.py depth_camera:=realsense
#   ros2 launch optimus_depth depth_camera.launch.py depth_camera:=orbbec
#
# Every profile starts its driver as node "depth_camera", so all of them give
# the same interface:
#   /depth_camera/depth/...           depth image + camera_info
#   /depth_camera/color/image_raw     colour image (dashboard camera view)
#   TF depth_camera_link -> optical frames (published by the driver)
# and depth_camera.launch.py adds base_link -> depth_camera_link from `mount`.
#
# MEASURE the mount: x, y = position of the camera's front glass centre from
# the robot centre (between the hub motors); z_above_floor = its height above
# the floor; pitch_deg = downward tilt (positive = looking down).
#
# To add another camera (e.g. OAK-D), copy a profile and set package,
# executable, namespace, params and depth_topic for its driver.

profiles:
  realsense:                     # Intel RealSense D435 / D435i / D455
    package: realsense2_camera
    executable: realsense2_camera_node
    namespace: ''                # topics are ~/..., i.e. /depth_camera/...
    depth_topic: /depth_camera/depth/image_rect_raw
    color_topic: /depth_camera/color/image_raw
    params:
      camera_name: depth_camera
      enable_depth: true
      enable_color: true
      enable_infra1: false
      enable_infra2: false
      enable_gyro: false
      enable_accel: false
      pointcloud.enable: false   # optimus_depth builds its own, lighter cloud
      align_depth.enable: false
      depth_module.depth_profile: 640x480x15
      rgb_camera.color_profile: 640x480x15
      publish_tf: true
    mount:
      x: 0.30                    # ESTIMATE - front face of the 600 mm body
      y: 0.0
      z_above_floor: 0.30        # ESTIMATE
      pitch_deg: 15.0
      yaw_deg: 0.0

  orbbec:                        # Orbbec Astra / Gemini (ros-$ROS_DISTRO-orbbec-camera)
    package: orbbec_camera
    executable: orbbec_camera_node
    namespace: depth_camera      # topics are namespace-relative
    depth_topic: /depth_camera/depth/image_raw
    color_topic: /depth_camera/color/image_raw
    params:
      camera_name: depth_camera
      enable_depth: true
      enable_color: true
      enable_point_cloud: false
      enable_colored_point_cloud: false
      depth_width: 640
      depth_height: 400
      depth_fps: 15
      color_width: 640
      color_height: 480
      color_fps: 15
      publish_tf: true
    mount:
      x: 0.30
      y: 0.0
      z_above_floor: 0.30
      pitch_deg: 15.0
      yaw_deg: 0.0

# depth_obstacle_node: depth image -> point clouds for the Nav2 "depth_layer".
depth_obstacle_node:
  ros__parameters:
    target_frame: base_link
    max_rate_hz: 10.0
    pixel_stride: 4              # use every 4th pixel in x and y
    min_range: 0.20              # m; closer depth is unreliable on most cameras
    max_range: 3.0               # m
    min_obstacle_height: 0.04    # m above the floor; lower = floor noise
    max_obstacle_height: 0.80    # m above the floor; higher cannot hit the robot
    cliff_depth: 0.08            # m below the floor = drop-off (dock edge, stairs); 0 disables
    voxel_size: 0.04             # m; obstacle points are thinned to this grid
